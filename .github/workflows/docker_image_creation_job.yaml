name: docker image creation

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'app.py'

env:
  dockerhub_username: ${{ secrets.DOCKER_USERNAME }}
  dockerhub_password: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.dockerhub_username }}
          password: ${{ env.dockerhub_password }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.dockerhub_username }}/voter-app:${{ github.run_id }}

  helm-update:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: navjeevanbomble83/FirstDeploymentRepo
          token: ${{ secrets.HELM_REPO_TOKEN }}
          path: voter-app-deploy

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Update Helm chart values
        run: |
          sed -i "s|tag:.*|tag: v${{ github.run_id }}|" voter-app-deploy/values.yaml
      
      - name: Commit and Push Changes
        run: |
          cd voter-app-deploy
          git config user.name "navz08"
          git config user.email "navjeevanbomble83@gmail.com"

          git add .
          git commit -m "Update image tag to ${{ github.run_id }}" || echo "No changes to commit"

          git push